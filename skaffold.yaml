apiVersion: skaffold/v4beta11
kind: Config
deploy:
  kubectl: {}
manifests:
  rawYaml:
    - ./infra/k8s/*
build:
  # googleCloudBuild:
  #   projectId: ticketzz
  local:
    push: false
  artifacts:
    #- image: eu.gcr.io/ticketzz/auth
    - image: moswilamdev/auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .